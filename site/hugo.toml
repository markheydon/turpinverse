baseURL = "https://turpinverse.uk/"
locale = "en-gb"
direction = "ltr"
label = "English (UK)"
title = "Turpinverse"
publishDir = "public"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.146.0"
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[params]
  env = "production"
  description = "The Richard Turpin legend reframed for CRM demos — legend first, ledger second."
  author = "Turpinverse"
  defaultTheme = "light"
  ShowReadingTime = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  disableSpecial1stPost = true
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false

  [params.label]
    text = "Turpinverse"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Personas"
    url = "/personas/"
    weight = 2
  [[menu.main]]
    name = "Organisations"
    url = "/organisations/"
    weight = 3
  [[menu.main]]
    name = "Deals"
    url = "/deals/"
    weight = 4
  [[menu.main]]
    name = "Cases"
    url = "/cases/"
    weight = 5
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 6
  [[menu.main]]
    name = "Articles"
    url = "/articles/"
    weight = 7
  [[menu.main]]
    name = "Gallery"
    url = "/galleries/"
    weight = 8
  [[menu.main]]
    name = "Timeline"
    url = "/timeline/"
    weight = 9
  [[menu.main]]
    identifier = "github"
    name = ""
    title = "Turpinverse on GitHub"
    url = "https://github.com/markheydon/turpinverse"

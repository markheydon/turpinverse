{{ define "main" }}
<article class="persona">
  <h1>{{ .Title }}</h1>
  <p class="meta"><strong>{{ .Params.jobTitle }}</strong> | {{ .Params.email }}</p>
  <div class="content">{{ .Content }}</div>
  {{ with .Params.organisations }}
  <section class="related-orgs">
    <h2>Organisations</h2>
    <ul>
      {{ range . }}
      <li><a href="{{ "/organisations/" | relURL }}{{ . }}/">{{ . }}</a></li>
      {{ end }}
    </ul>
  </section>
  {{ end }}
</article>
{{ end }}

{{/* Expects a slice of case records from hugo.Data.cases */}}
{{ if . }}
<section class="related-records related-cases">
  <h2>Cases</h2>
  <div class="record-card-grid">
    {{ range . }}
    <a class="record-card case-record" href="{{ "/cases/" | relURL }}{{ .caseId }}/">
      <p class="record-card-title">{{ .subject }}</p>
      <div class="record-card-badges">
        {{ with .status }}<span class="status-badge status-{{ . | urlize }}">{{ . }}</span>{{ end }}
        {{ with .priority }}<span class="status-badge priority-{{ . | urlize }}">{{ . }}</span>{{ end }}
      </div>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}

{{/* Expects a slice of article records from hugo.Data.articles */}}
{{ if . }}
<section class="related-records related-articles">
  <h2>Published articles</h2>
  <div class="record-card-grid">
    {{ range . }}
    <a class="record-card article-record" href="{{ "/articles/" | relURL }}{{ .id }}/">
      <p class="record-card-title">{{ .title }}</p>
      {{ with .publishedAt }}<p class="record-card-meta">{{ . }}</p>{{ end }}
      {{ with .collection }}<p class="record-card-meta">{{ . }}</p>{{ end }}
      {{ with .excerpt }}<p class="record-card-summary">{{ . }}</p>{{ end }}
    </a>
    {{ end }}
  </div>
</section>
{{ end }}

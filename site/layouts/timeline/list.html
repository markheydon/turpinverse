{{ define "main" }}
<article class="timeline post-single">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}
    <div class="section-intro">{{ . }}</div>
    {{ end }}
  </header>

  {{ with hugo.Data.events }}
  <div class="timeline-list">
    {{ range sort . "date" }}
    <div class="timeline-item">
      <span class="timeline-date">{{ .date }}</span>
      <span class="category-badge category-{{ .category }}">{{ .category }}</span>
      <h3>{{ .title }}</h3>
      {{ with .location }}<p class="timeline-location">{{ . }}</p>{{ end }}
      <div class="timeline-description">{{ .description | markdownify }}</div>
    </div>
    {{ end }}
  </div>
  {{ end }}
</article>
{{ end }}

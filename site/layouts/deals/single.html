{{ define "main" }}
<article class="deal post-single">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    <p class="card-meta">
      {{ with .Params.stage }}<span class="status-badge status-{{ . | urlize }}">{{ . }}</span>{{ end }}
      {{ with .Params.amount }}&nbsp;·&nbsp;£{{ . }}{{ end }}
      {{ with .Params.closeDate }}&nbsp;·&nbsp;Close {{ . }}{{ end }}
    </p>
  </header>

  <div class="post-content md-content">{{ .Content }}</div>

  {{ partial "related-parties.html" . }}
</article>
{{ end }}

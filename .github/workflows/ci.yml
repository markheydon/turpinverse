name: CI

on:
  push:
    branches: [main, '001-*']
  pull_request:
    branches: [main]

jobs:
  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-powershell@v1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Warning,Error
          if ($issues) {
            $issues | Format-List
            exit 1
          }

      - name: Check script naming conventions
        shell: pwsh
        run: ./scripts/Test-ScriptConventions.ps1

      - name: Lint shell scripts
        run: |
          if compgen -G "scripts/**/*.sh" > /dev/null; then
            shellcheck scripts/**/*.sh
          else
            echo "No shell scripts in scripts/ — skipping shellcheck"
          fi

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Turpinverse.slnx

      - name: Verify code format
        run: dotnet format Turpinverse.slnx --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build Turpinverse.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test Turpinverse.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

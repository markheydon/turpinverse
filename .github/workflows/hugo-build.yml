name: Hugo Build

on:
  workflow_call:
    inputs:
      deploy:
        description: Commit and push built site to docs/
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Validate canon
        run: dotnet test tests/Turpinverse.Core.UnitTests --filter "Category=CanonValidation" --configuration Release

      - name: Generate Hugo content
        run: dotnet run --project src/Turpinverse.Tools.GenerateHugoContent --configuration Release

      - name: Build Hugo site
        run: hugo --minify
        working-directory: site

      - name: Deploy to docs/
        if: inputs.deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Deploy Hugo site to docs/"
          git push
